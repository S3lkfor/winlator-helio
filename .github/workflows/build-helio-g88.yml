name: Build Winlator Helio G88 APK

on:
  push:
    branches: [ main, helio-g88 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub release with the APK'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write   # required for the optional release job
  actions: read

jobs:
  # --------------------------------------------------------------
  # 1. Smoke test — Linux-side sanity check (always runs)
  # --------------------------------------------------------------
  lint:
    name: Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON presets
        run: |
          for f in helio-g88/presets/helio_g88_defaults.json; do
            echo "Validating $f"
            python3 -c "import json; json.load(open('$f'))" || exit 1
          done
      - name: Validate YAML files
        run: |
          python3 -c "import yaml; yaml.safe_load(open('helio-g88/ci/validate_config.yaml'))" || exit 1
      - name: Check manifest is valid XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml')"

  # --------------------------------------------------------------
  # 2. Build the actual Android APK
  # --------------------------------------------------------------
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'
          ndk-version: '26.1.10909125'
          cmake-version: '3.22.1'

      - name: Download upstream Winlator binary assets
        run: |
          set -e
          mkdir -p app/src/main/assets
          cd app/src/main/assets

          BASE="https://github.com/brunodev85/winlator/releases/latest/download"
          # The upstream release ships these in a single zip; pull what we need.
          echo "Fetching upstream asset index…"
          curl -sL "$BASE/SHA256SUMS" -o SHA256SUMS 2>/dev/null || true
          curl -sL -o rootfs.tzst              "$BASE/rootfs.tzst"
          curl -sL -o rootfs_patches.tzst     "$BASE/rootfs_patches.tzst"
          curl -sL -o container_pattern.tzst  "$BASE/container_pattern.tzst"
          curl -sL -o pulseaudio.tzst         "$BASE/pulseaudio.tzst"

          for f in rootfs.tzst rootfs_patches.tzst container_pattern.tzst pulseaudio.tzst; do
            if [ ! -s "$f" ]; then
              echo "::error::Failed to download $f"
              exit 1
            fi
            echo "  $f: $(du -h $f | cut -f1)"
          done

      - name: Grant Execute Permissions
        run: |
          chmod +x ./gradlew
          chmod +x helio-g88/build.sh

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate built APK
        id: locate
        run: |
          APK=$(find app/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "::notice::APK built at $APK ($(du -h $APK | cut -f1))"

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Helio-G88-Debug
          path: ${{ steps.locate.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease --no-daemon
        continue-on-error: true   # signing is user-provided

      - name: Upload Release APK Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Winlator-Helio-G88-Release-unsigned
          path: app/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

  # --------------------------------------------------------------
  # 3. Optional GitHub Release with the APK attached
  # --------------------------------------------------------------
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Winlator-Helio-G88-Debug
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.apk
          generate_release_notes: true
          body: |
            ## Winlator Helio G88 Edition

            Pre-built APK optimised for MediaTek Helio G80 – G100 (Mali-G52 MC2/3) devices.

            **Install:** download `Winlator-Helio-G88-Debug.apk`, enable *Install unknown apps* for your file manager, then open the APK on your device.

            **Default settings out of the box:**
            - Graphics driver: **VirGL** (best Mali-G52 backend)
            - Box64 preset: **HELIO_G88** (Cortex-A75 strongmem, no bigblock)
            - Resolution: **960×544** (Mali-friendly, sub-720p)
            - Mesa: 22 threads, 512 MB shader cache, lazy Zink descriptors

            See `helio-g88/README.md` for the full optimization guide and game compatibility list.
