name: Build Winlator Helio G88 APK

on:
  push:
    branches: [ main, helio-g88 ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      release:
        description: 'Create a GitHub release with the APK'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write
  actions: read

jobs:
  # --------------------------------------------------------------
  # 1. Smoke test — always runs first, fails fast
  # --------------------------------------------------------------
  lint:
    name: Lint & Validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate JSON presets
        run: |
          python3 - <<'PY'
          import json, sys, os
          for f in [
            "helio-g88/presets/helio_g88_defaults.json",
            "helio-g88/ci/validate_config.yaml",
          ]:
            if f.endswith(".json"):
              with open(f) as fh:
                json.load(fh)
              print(f"OK  {f}")
          PY

      - name: Validate YAML files
        run: |
          python3 - <<'PY'
          import sys
          try:
            import yaml
          except ImportError:
            print("::warning::PyYAML not installed; installing")
            import subprocess
            subprocess.check_call([sys.executable, "-m", "pip", "install", "--quiet", "pyyaml"])
            import yaml
          for f in [
            "helio-g88/ci/validate_config.yaml",
            ".github/workflows/build-helio-g88.yml",
          ]:
            with open(f) as fh:
              yaml.safe_load(fh)
            print(f"OK  {f}")
          PY

      - name: Check manifest is valid XML
        run: python3 -c "import xml.etree.ElementTree as ET; ET.parse('app/src/main/AndroidManifest.xml')"

      - name: Verify preset schema
        run: |
          python3 - <<'PY'
          import json, yaml, sys
          with open("helio-g88/presets/helio_g88_defaults.json") as f:
            cfg = json.load(f)
          defaults = cfg.get("defaults", {})
          # Check top-level metadata
          for key in ["profile_name", "target_chips", "gpu_architecture"]:
            if key not in cfg:
              print(f"::error::missing top-level key: {key}")
              sys.exit(1)
          # Check nested defaults
          required_defaults = ["graphics_driver", "screen_resolution", "box64_preset", "env_vars"]
          missing = [k for k in required_defaults if k not in defaults]
          if missing:
            print(f"::error::defaults is missing required keys: {missing}")
            sys.exit(1)
          print(f"OK  schema check passed (profile={cfg.get('profile_name')}, {len(defaults.get('env_vars',{}))} env vars)")
          PY

      - name: Bash syntax check
        run: bash -n helio-g88/build.sh

  # --------------------------------------------------------------
  # 2. Build the actual Android APK
  # --------------------------------------------------------------
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: lint
    timeout-minutes: 90

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: 34
          build-tools-version: '34.0.0'
          ndk-version: '26.1.10909125'
          cmake-version: '3.22.1'

      - name: Download upstream APK & extract native libs
        run: |
          set -e
          WORKSPACE="$GITHUB_WORKSPACE"
          echo "Fetching upstream Winlator APK…"
          curl -sL -o /tmp/winlator.apk "https://github.com/brunodev85/winlator/releases/latest/download/Winlator_11.1.apk"
          echo "Extracting native libraries…"
          rm -rf "$WORKSPACE/app/src/main/jniLibs"
          mkdir -p "$WORKSPACE/app/src/main/jniLibs/arm64-v8a"
          cd /tmp
          unzip -o winlator.apk "lib/arm64-v8a/*.so" -d extracted 2>/dev/null
          cp extracted/lib/arm64-v8a/*.so "$WORKSPACE/app/src/main/jniLibs/arm64-v8a/"
          # Remove libraries that the local CMake build will compile from source.
          # (CMake will produce its own versions of these; jniLibs copies would
          # cause mergeDebugNativeLibs to see them twice.)
          echo "Removing libs that conflict with local CMake build…"
          CONFLICT_LIBS="libfile_redirect_hook.so libmain_hook.so libgsl_alloc_hook.so libhook_impl.so libgladiorenderer.so libmidihandler.so libvirglrenderer.so libvortekrenderer.so libwinlator.so libadrenotools.so libomp.so"
          for f in $CONFLICT_LIBS; do
            if [ -f "$WORKSPACE/app/src/main/jniLibs/arm64-v8a/$f" ]; then
              rm "$WORKSPACE/app/src/main/jniLibs/arm64-v8a/$f"
              echo "  removed $f"
            fi
          done
          echo "Final prebuilt libs:"
          ls -la "$WORKSPACE/app/src/main/jniLibs/arm64-v8a/"

      - name: Grant Execute Permissions
        run: |
          chmod +x ./gradlew
          chmod +x helio-g88/build.sh

      # ---------- Debug build (always) ----------
      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate built debug APK
        id: locate_debug
        run: |
          APK=$(find app/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "apk_path=$APK" >> $GITHUB_OUTPUT
          echo "::notice::Debug APK built at $APK ($(du -h $APK | cut -f1))"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Winulator-Helio-G88-Debug
          path: ${{ steps.locate_debug.outputs.apk_path }}
          if-no-files-found: error
          retention-days: 14

      # ---------- Release build (signed if keystore provided) ----------
      - name: Prepare signing keystore
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          mkdir -p $HOME/.gradle
          echo "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > $HOME/.gradle/release.keystore
          ls -la $HOME/.gradle/release.keystore

      - name: Build Signed Release APK
        if: env.HAS_KEYSTORE == 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          ./gradlew assembleRelease --no-daemon \
            -PRELEASE_STORE_FILE=$HOME/.gradle/release.keystore \
            -PRELEASE_STORE_PASSWORD=${{ secrets.RELEASE_STORE_PASSWORD }} \
            -PRELEASE_KEY_ALIAS=${{ secrets.RELEASE_KEY_ALIAS }} \
            -PRELEASE_KEY_PASSWORD=${{ secrets.RELEASE_KEY_PASSWORD }}
        continue-on-error: false

      - name: Build Unsigned Release APK (fallback)
        if: env.HAS_KEYSTORE != 'true'
        env:
          HAS_KEYSTORE: ${{ secrets.RELEASE_KEYSTORE_BASE64 != '' }}
        run: |
          ./gradlew assembleRelease --no-daemon
        continue-on-error: true

      - name: Locate built release APK
        id: locate_release
        if: success() || failure()
        run: |
          APK=$(find app/app/build/outputs/apk/release -name '*.apk' 2>/dev/null | head -1)
          if [ -z "$APK" ]; then
            echo "apk_path=" >> $GITHUB_OUTPUT
            echo "::warning::No release APK was produced"
          else
            echo "apk_path=$APK" >> $GITHUB_OUTPUT
            echo "::notice::Release APK built at $APK ($(du -h $APK | cut -f1))"
          fi

      - name: Upload Release APK Artifact
        if: steps.locate_release.outputs.apk_path != ''
        uses: actions/upload-artifact@v4
        with:
          name: Winulator-Helio-G88-Release
          path: ${{ steps.locate_release.outputs.apk_path }}
          if-no-files-found: warn
          retention-days: 30

  # --------------------------------------------------------------
  # 3. GitHub Release (only on version tags)
  # --------------------------------------------------------------
  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download debug APK
        uses: actions/download-artifact@v4
        with:
          name: Winulator-Helio-G88-Debug
          path: artifacts/debug
        continue-on-error: true

      - name: Download release APK
        uses: actions/download-artifact@v4
        with:
          name: Winulator-Helio-G88-Release
          path: artifacts/release
        continue-on-error: true

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/debug/*.apk
            artifacts/release/*.apk
          generate_release_notes: true
          body: |
            ## Winulator Helio G88 Edition

            Pre-built APK optimised for MediaTek Helio G80 – G100 (Mali-G52 MC2/3) devices.

            **Install:** download `Winulator-Helio-G88-Debug.apk`, enable *Install unknown apps* for your file manager, then open the APK on your device.

            **Default settings out of the box:**
            - Graphics driver: **VirGL** (best Mali-G52 backend)
            - Box64 preset: **HELIO_G88** (Cortex-A75 strongmem, no bigblock)
            - Resolution: **960×544** (Mali-friendly, sub-720p)
            - Mesa: 22 threads, 512 MB shader cache, lazy Zink descriptors

            See `helio-g88/README.md` for the full optimization guide and game compatibility list.
