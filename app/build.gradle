apply plugin: 'com.android.application'

android {
    namespace 'com.winlator'
    compileSdk 35

    defaultConfig {
        applicationId 'com.winlator'
        minSdkVersion 26
        targetSdkVersion 28
        versionCode 32
        versionName "11.2"
    }

    // ------------------------------------------------------------------
    // Signing config (release builds)
    // Populate these via ~/.gradle/gradle.properties OR GitHub Secrets.
    // When any value is missing the release build falls back to the
    // debug signing config (still produces an installable APK for QA).
    // ------------------------------------------------------------------
    signingConfigs {
        release {
            if (project.hasProperty('RELEASE_STORE_FILE') &&
                file(project.property('RELEASE_STORE_FILE')).exists()) {
                storeFile      file(project.property('RELEASE_STORE_FILE'))
                storePassword  project.property('RELEASE_STORE_PASSWORD')
                keyAlias       project.property('RELEASE_KEY_ALIAS')
                keyPassword    project.property('RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters 'arm64-v8a'
            }
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            ndk {
                abiFilters 'arm64-v8a'
            }
            signingConfig signingConfigs.release
        }
    }

    lintOptions {
        checkReleaseBuilds false
    }

    ndkVersion '24.0.8215888'

    externalNativeBuild {
        cmake {
            version '3.22.1'
            path 'src/main/cpp/CMakeLists.txt'
        }
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.4.0'
    implementation 'androidx.preference:preference:1.2.1'
    implementation 'com.google.android.material:material:1.4.0'
    implementation 'com.github.luben:zstd-jni:1.5.2-3@aar'
    implementation 'org.tukaani:xz:1.7'
    implementation 'org.apache.commons:commons-compress:1.20'
}
